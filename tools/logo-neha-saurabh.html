<!doctype html>

</defs>

      <path d="M145 752Q151 732 157 752Z" fill="#F3E6C8" stroke="#B89658" stroke-width=".8"/>

      <path d="M22 790Q29 776 36 790ZM210 790Q217 776 224 790Z" fill="#F3E6C8" stroke="#B89658" stroke-width=".8"/>

      <path d="M2 798H118V808H2Z" fill="#E2CDA0" stroke="#B89658" stroke-width="1"/>
      <path d="M-6 808H126V818H-6Z" fill="#DCC48E" stroke="#B89658" stroke-width="1"/>

<!-- ===================== ARCH ===================== -->
<g id="arch" fill="none" stroke-linecap="round" stroke-linejoin="round">

          stroke="url(#gold)" stroke-width="9"/>

          stroke="url(#gold)" stroke-width="3.5" opacity=".95"/>

    <g fill="#D8B25A"><circle cx="440" cy="190" r="3"/><circle cx="390" cy="236" r="3"/><circle cx="342" cy="282" r="3"/><circle cx="296" cy="336" r="3"/><circle cx="258" cy="396" r="3"/></g>
  </g>
  <use href="#halfArch" transform="translate(1000 0) scale(-1 1)"/>

  <!-- finial -->

    <path d="M0 118V90M0 90C-12 84-14 68 0 56C14 68 12 84 0 90Z" stroke="url(#gold)" stroke-width="5" fill="#E5C266"/>
    <path d="M0 56V38" stroke="url(#gold)" stroke-width="4"/>

    <circle cx="0" cy="34" r="5" fill="#E5C266" stroke="#B8893B" stroke-width="1.5"/>
  </g>

  <!-- pillars -->
  <g id="pillar">
    <rect x="196" y="500" width="36" height="366" fill="url(#goldV)" stroke="#8E6A1F" stroke-width="1.5"/>
    <g fill="none" stroke="#8E6A1F" stroke-width="1" opacity=".7"><path d="M206 520V850M214 520V850M222 520V850"/></g>
    <!-- capital -->
    <path d="M186 500H242V486H232L236 470H192L196 486H186Z" fill="url(#goldV)" stroke="#8E6A1F" stroke-width="1.5"/>
    <path d="M190 470Q214 446 238 470Z" fill="url(#goldV)" stroke="#8E6A1F" stroke-width="1.5"/>

  </g>
  <use href="#pillar" transform="translate(1000 0) scale(-1 1)"/>

  <path d="M252 892H748" stroke="url(#gold)" stroke-width="7"/>
  <path d="M252 902H748" stroke="url(#gold)" stroke-width="2.5"/>
</g>
